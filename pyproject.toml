[project]
name = "deploy"
version = "0.1.0"
description = "Thin deployment tool for natpat.net"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
deploy = "deploy.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deploy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
