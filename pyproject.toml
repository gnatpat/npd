[project]
name = "npd"
version = "0.1.0"
description = "Thin deployment tool for natpat.net"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
npd = "npd.cli:main"
npd-deploy = "npd.deploy_hook:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/npd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
